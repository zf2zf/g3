---
name: ftp_auditor

protocol_inspection:
  data0_buffer_size: 16KB
  inspect_max_depth: 5
  data0_wait_timeout: 5s
  data0_read_timeout: 5s
  data0_size_limit:
    ftp_server_greeting_msg: 2KB

# TLS 拦截配置（FTPS 上传审计需要）
tls_cert_generator: { }
tls_interception_client: { }
tls_ticketer: { }

tls_keylog:
    enable: true
    max_entries: 100

h1_interception:
  req_hasbody: true
  req_body_min_size: 8

# ICAP 服务配置
icap_reqmod_service: icap://127.0.0.1:1344/icap_audit
# 排查送审内容时改成 map 形态，多一个 log_audit_header 开关：把每条送审的
# ICAP 头 + 封装的请求头打进日志，正文不打，X-TLS-* 密钥值屏蔽成 ***。
# 看这条日志要给 g3proxy 加 -v，否则 info 会被日志桥丢掉。
# icap_reqmod_service:
#   url: icap://127.0.0.1:1344/icap_audit
#   log_audit_header: true

application_audit_ratio: 1.0
