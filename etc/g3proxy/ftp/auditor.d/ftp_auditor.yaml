---
name: ftp_auditor

protocol_inspection:
  data0_buffer_size: 16KB
  inspect_max_depth: 5
  data0_wait_timeout: 5s
  data0_read_timeout: 5s
  data0_size_limit:
    ftp_server_greeting_msg: 2KB

# TLS 拦截配置（FTPS 上传审计需要）
tls_cert_generator: { }
tls_interception_client: { }
tls_ticketer: { }

tls_keylog:
    enable: true
    max_entries: 100

h1_interception:
  req_hasbody: true
  req_body_min_size: 8

# ICAP 服务配置。log_audit_header: true 时把每条送审的 ICAP 头 + 封装的请求头
# 打进日志（正文不打，X-TLS-* 密钥值屏蔽成 ***）；g3proxy 检测到该开关会自动
# 把库日志门限放到 info，无需加 -v。默认 false（退回 debug 级，要 -vv 才看到）。
icap_reqmod_service:
  url: icap://127.0.0.1:1344/icap_audit
  log_audit_header: false

application_audit_ratio: 1.0
