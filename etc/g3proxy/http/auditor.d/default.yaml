name: https-up
protocol_inspection: { }
			
tls_cert_generator: { }
tls_interception_client: { } # 代理对目标地址TLS连接参数
tls_ticketer: { }

tls_keylog:
    enable: true
    max_entries: 100
	
h1_interception:
    req_hasbody: true
    req_body_min_size: 8
    # 跳过 application/x-www-form-urlencoded 表单（登录框/搜索框）的上传审计；
    # 浏览器文件上传的 multipart/form-data 不受影响，仍按上面的阈值送审。默认 false。
    # req_skip_urlencoded_form: true
	
h2_interception: { } 

application_audit_ratio: 1.0

# tls_stream_dump: { }
# log_audit_header: true 时 g3-icap-client 把每条送审的 ICAP 头 + 封装的 HTTP 请求头
# 打进日志（正文不打，X-TLS-* 密钥头屏蔽成 ***），排查送审内容用；g3proxy 检测到
# 该开关会自动把库日志门限放到 info，无需给进程加 -v。默认 false（退回 debug 级，
# 要 -vv 才看到）。
icap_reqmod_service:
  url: icap://127.0.0.1:1344/icap_audit
  log_audit_header: false
# 同时进行的旁路上传审计条数上限（默认 64，0 表示不设限）。名额用尽时
# 新请求直接退化为直通转发并计入跳过数，不排队等待，因此调小只会少审计
# 几笔上传，绝不会变慢转发。
# upload_audit_max_concurrency: 64