# 基础监听设置
listen=YES
listen_ipv6=NO

# 安全与访问控制：禁止匿名，允许本地用户
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# 目录限制：将用户限制在主目录内
chroot_local_user=YES
allow_writeable_chroot=YES

# 日志与显示
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES

# 被动模式端口范围（需在防火墙中放行）
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=31000

# 其他
pam_service_name=vsftpd
userlist_enable=YES
tcp_wrappers=YES



# 启用 SSL
ssl_enable=YES
rsa_cert_file=/etc/ssl/certs/vsftpd.pem
rsa_private_key_file=/etc/ssl/private/vsftpd.key

# 明文与加密都接受：只收加密的原因是下面这两个开关，设成 NO 之后客户端不发
# AUTH TLS 就按明文 FTP 走、发了就走 FTPS；ssl_enable=YES 保留，FTPS 仍然可用。
# require_ssl_reuse 保持默认（YES）别关：数据通道要复用控制通道的 TLS 会话，
# g3proxy 拦截 FTPS 时已经做了会话注入，这里关掉是多余的让步。
force_local_logins_ssl=NO
force_local_data_ssl=NO

# 缺省没有 dhparam_file 时 vsftpd 用内置 1024 位 DH，OpenSSL 默认安全级别直接拒绝
# （经 g3proxy 拦截时表现为 dh key too small，代理侧只能靠 security_level: 0 兜）。
# 换成分以下的 2048 位参数后，代理那边的 security_level: 0 就可以删掉：
#   sudo openssl dhparam -out /etc/ssl/private/dhparams.pem 2048
#dhparam_file=/etc/ssl/private/dhparams.pem

# 禁用过时协议
ssl_sslv2=NO
ssl_sslv3=NO
ssl_tlsv1=YES
