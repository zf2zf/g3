---
# run 包的入口配置，安装到 /opt/zf/g3/conf/g3proxy.yaml，systemd 单元用 -c
# 直接指向它。server / auditor 全部内联在本文件里，不再依赖 server.d、
# auditor.d 子目录——现场只看这一个文件就能改端口、ICAP 地址、审计开关。

runtime:
  thread_number: 2

# 日志走标准输出，由 systemd 收进 journald：journalctl -u g3proxy
log: stdout

controller:
  local:
    recv_timeout: 30
    send_timeout: 1

auditor:
  - name: https-up
    protocol_inspection: { }

    # 中间人证书签发客户端：连接 g3fcgen（默认 127.0.0.1:2999）按 SNI 取证书，
    # g3fcgen 持有 CA。改这里的 query_peer_addr 可以指向别机的 g3fcgen。
    tls_cert_generator: { }
    # 代理对目标地址TLS连接参数：做中间人时 g3proxy 自己是 TLS 客户端，默认只信系统根
    # CA、并按 OpenSSL 安全级别（1）要求源站的密码参数。内网源站两条都容易踩，任一失败
    # 整条连接就以 InterceptionError 断开（FTP 的表现：客户端 AUTH TLS 之后断流，HTTP 却
    # 一切正常）：
    #   certificate verify failed -> 源站是自签证书
    #   dh key too small          -> 源站 dhparams 只有 1024 位（现网 vsftpd 3.0.2 即如此）
    # 内网源站无法预先枚举——今天堵 FTP 一台自签，明天又是别台——所以不按台追加
    # ca_certificate 信任锚，直接不校验源站证书。两个键各管一件事、谁也替不了谁：
    # insecure 关掉证书校验（等价 curl -k），security_level: 0 才放行 1024 位 DH 这类弱
    # 参数；只配 insecure 的话 FTP 仍连不上，握手会接着报 dh key too small。
    # 代价必须知情：这份 TLS 客户端上下文整个 auditor 共用，g3proxy 到源站这一段从此发现
    # 不了证书被冒充或被降级，被拦截的公网 HTTPS 也一并不再校验源站证书；启动日志里那句
    # "Tls Insecure Mode: Tls Peer (server) cert vertification is no longer enforced" 就是
    # 这件事的自述，不是故障。要收紧就单独给内网协议开一个 server 段（另听一个端口）配一
    # 个专用 auditor，只在那个 auditor 上设 insecure，公网流量继续走带校验的那个。
    tls_interception_client:
      insecure: true
      security_level: 0
    tls_ticketer: { }

    tls_keylog:
      enable: true
      max_entries: 100

    h1_interception:
      req_hasbody: true
      req_body_min_size: 8
      # 跳过 application/x-www-form-urlencoded 表单（登录框、搜索框）的上传审计：
      # 这类请求体里没有文件，只按长度阈值筛会留下海量小表单。浏览器上传文件走的是
      # multipart/form-data，不受本项影响，仍按上面的阈值送审。默认 false（不跳过）。
      # req_skip_urlencoded_form: true

    h2_interception: { }

    application_audit_ratio: 1.0

    # tls_stream_dump: { }
    icap_reqmod_service: icap://127.0.0.1:1344/icap_audit
    # 排查送审内容时把上面一行换成 map 形态，多一个 log_audit_header 开关：
    # g3-icap-client 会把每条送审的 ICAP 头 + 封装的 HTTP 请求头打进日志，
    # 正文一律不打，X-TLS-* 密钥头的值屏蔽成 ***。默认 false（只在 debug 级打）。
    # 看这条日志要给 g3proxy 加 -v（systemctl edit g3proxy 改 ExecStart），
    # 不带 -v 时库的 log 记录只放行 warn 及以上，info 会被丢掉。
    # icap_reqmod_service:
    #   url: icap://127.0.0.1:1344/icap_audit
    #   log_audit_header: true
    # 同时进行的旁路上传审计条数上限（默认 64，0 表示不设限）。名额用尽时
    # 新请求直接退化为直通转发并计入跳过数，不排队等待，因此调小只会少审计
    # 几笔上传，绝不会变慢转发。
    # upload_audit_max_concurrency: 64

server:
  - name: cds
    escaper: default
    auditor: https-up
    type: http_proxy
    #tls:
    #  certificate: cert.pem
    #  private_key: key.pem
    listen:
      address: "[::]:3128"
    tcp_sock_speed_limit: 100M

    tls_client: { }

# 出口解析与直连转发：server 段引用的 escaper: default 必须在这里定义出来，
# 否则 g3proxy 会用内置的 DummyDeny 占位，所有请求以 ForbiddenByRule 拒绝。
# 需要按域名/地址分流时，换成 fail_over / route_* 等类型或改走 escaper.d 目录。
resolver:
  - name: default
    type: c-ares

escaper:
  - name: default
    type: direct_fixed
    resolver: default
    no_ipv6: true
